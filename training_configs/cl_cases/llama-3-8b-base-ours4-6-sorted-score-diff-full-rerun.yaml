# Model arguments
model_name_or_path: princeton-nlp/Llama-3-Base-8B-SFT
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# LoRA arguments
use_peft: false
lora_r: 128
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj


# Data training arguments
dataset_mixer:
  jlpang888/ultrafeedback_sorted_score_diff: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 12

# SimPOTrainer arguments
bf16: true
beta: 0.01
label_smoothing: 0.1
loss_type: noisy-tolerant-4-6
do_eval: true
reference_free: false
evaluation_strategy: steps
eval_steps: 40
gradient_accumulation_steps: 4
per_device_train_batch_size: 5
per_device_eval_batch_size: 5
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
hub_model_id: jlpang888/llama-3-8b-base-ours4-6-sorted-score-diff-full-rerun
learning_rate: 1.0e-6
log_level: info
logging_steps: 5
lr_scheduler_type: cosine
max_length: 1024
max_prompt_length: 512
num_train_epochs: 1
optim: adamw_torch
output_dir: /mnt/data1/jinlong/CL_DPO_outputs/llama-3-8b-ours4-6-sorted-score-diff-full-rerun/
run_name: llama-3-8b-base-ours4-6-sorted-score-diff-full-rerun
push_to_hub: false
save_strategy: "steps"
save_steps: 168
report_to:
- wandb
save_total_limit: 20
seed: 42
warmup_ratio: 0.1
